[package]
authors = ["Liam Dodds <liamdodds101@gmail.com>"]
name = "tors-rs"
version = "0.1.0"
edition = "2024"
description = "A Bittorrent Client"
readme = "README.md"
repository = "https://github.com/liamd101/tors-rs"
license = "MIT"

[profile.release]
strip = true
lto = true
panic = "abort"

[dependencies]
anyhow = "1.0.99"
bytes = "1"
clap = { version = "4.5.45", features = ["derive"] }
dotenv = "0.15.0"
rand = "0.9.2"
reqwest = "0.12.22"
serde = { version = "1.0.219", features = ["derive"] }
serde_bencode = "0.2.4"
sha1 = "0.10.6"
tokio = { version = "1.47.1", features = ["fs", "macros", "rt", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
urlencoding = "2.1.3"
